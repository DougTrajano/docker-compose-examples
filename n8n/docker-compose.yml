services:
  n8n-db:
    container_name: n8n-db
    image: postgres:16-alpine
    restart: always
    volumes:
      - data_n8n_db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB-n8n}
      POSTGRES_USER: ${POSTGRES_USER-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD-n8n}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    container_name: n8n
    image: docker.n8n.io/n8nio/n8n:2.45.7
    restart: always
    ports:
      - 5678:5678
    depends_on:
      n8n-db:
        condition: service_healthy
    volumes:
      - data_n8n:/home/node/.n8n
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD-n8n}
      N8N_HOST: ${N8N_HOST-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL-http}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE-false}
      WEBHOOK_URL: ${WEBHOOK_URL-http://localhost:5678/}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE-UTC}
      TZ: ${GENERIC_TIMEZONE-UTC}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY-change-me-n8n-encryption-key}
      N8N_RUNNERS_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  data_n8n:
    driver: local
  data_n8n_db:
    driver: local
